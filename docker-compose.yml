services:
  postgres:
    image: postgres:16-alpine
    container_name: sistemabar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sistemabar
      POSTGRES_PASSWORD: sistemabar_secret
      POSTGRES_DB: sistemabar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistemabar -d sistemabar"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistemabar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sistemabar:sistemabar_secret@postgres:5432/sistemabar?schema=public
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: 15m
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9000}
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  print-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistemabar-print
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sistemabar:sistemabar_secret@postgres:5432/sistemabar?schema=public
      NODE_ENV: production
    command: node dist/src/worker/print.worker.js

  # Frontend: build localmente y servir con nginx en producción
  # nginx:
  #   image: nginx:alpine
  #   volumes:
  #     - ./frontend/dist/pwa:/usr/share/nginx/html
  #     - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
  #   ports:
  #     - "9000:80"

volumes:
  postgres_data:
